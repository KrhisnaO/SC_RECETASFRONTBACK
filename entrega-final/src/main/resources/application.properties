spring.application.name=recetas-back


# Puerto 8080 para el backend
server.port=8080

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/recetas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=recetas_user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Upload de archivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT (sobreescribir via env var JWT_SECRET en produccion)
jwt.secret=${JWT_SECRET:DevelopmentOnlySecretKeyChangeMeInProduction1234567890}
jwt.access-token.expiration-ms=3600000
jwt.refresh-token.expiration-ms=604800000
