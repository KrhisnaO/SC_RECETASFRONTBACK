version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: recetas_mysql
    environment:
      MYSQL_DATABASE: recetas_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: recetas_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
