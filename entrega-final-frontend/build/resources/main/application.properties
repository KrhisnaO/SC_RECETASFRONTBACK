spring.application.name=recetas-frontend

# Puerto del frontend (separado del backend en 8080)
server.port=8081

# URL del backend REST
backend.base-url=http://localhost:8080

# Thymeleaf (aquí sí se usa - el frontend tiene las vistas)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
