<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - Recetas Premium')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <div class="auth-container">
    <h2 class="section-heading">Iniciar Sesión</h2>
    <div th:if="${error}" class="error-msg">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="success-msg">Sesión cerrada exitosamente.</div>
    <!-- POST hacia el WebController del frontend, que llama al backend -->
    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label>Nombre de usuario</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <div class="test-credentials">
      <p>Credenciales de prueba: <b>admin</b> / <b>password</b></p>
    </div>
  </div>
</main>
</body>
</html>
