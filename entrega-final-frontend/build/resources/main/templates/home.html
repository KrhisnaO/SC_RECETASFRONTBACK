<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Home - Recetas Premium')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Descubre tu proxima aventura culinaria</h1>
                <p>Las mejores recetas del mundo en tu mesa.</p>
                <a th:href="@{/buscar}" class="btn btn-lg btn-primary">Explorar Recetas</a>
            </div>
        </section>

        <section class="recipes-grid-section">
            <h2 class="section-heading">Recetas Premium</h2>
            <div class="grid">
                <div th:each="receta : ${recetas}" class="card recipe-card">
                    <div class="card-img" th:style="'background-image: url(' + ${receta.imagenUrl} + ');'"></div>
                    <div class="card-content">
                        <span class="badge" th:text="${receta.tipoCocina}">Cocina</span>
                        <h3 th:text="${receta.nombre}">Nombre Receta</h3>
                        <p th:text="${receta.descripcion}">Descripcion rapida.</p>
                        <div class="card-meta">
                            <span><span th:text="${receta.tiempoPrepMinutos} + ' min'"></span></span>
                            <span><span th:text="${receta.dificultad}"></span></span>
                        </div>
                        <a th:href="@{/receta/{id}(id=${receta.id})}" class="btn btn-outline btn-block">Ver Detalles
                            Completos</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
