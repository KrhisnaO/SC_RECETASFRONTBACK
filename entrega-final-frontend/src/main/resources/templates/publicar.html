<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Publicar Receta - Recetas Premium')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <div class="auth-container" style="max-width: 700px;">
    <h2 class="section-heading">Publicar Nueva Receta</h2>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>
    <div th:if="${param.publicado}" class="success-msg">¡Receta publicada exitosamente!</div>

    <form th:action="@{/publicar}" method="post" enctype="multipart/form-data">

      <div class="form-group">
        <label for="nombre">Nombre de la receta *</label>
        <input type="text" id="nombre" name="nombre" class="form-control"
               placeholder="Ej. Pollo al curry" required maxlength="100">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="tipoCocina">Tipo de cocina</label>
          <select id="tipoCocina" name="tipoCocina" class="form-control">
            <option value="">Selecciona...</option>
            <option value="Mexicana">Mexicana</option>
            <option value="Italiana">Italiana</option>
            <option value="Asiatica">Asiática</option>
            <option value="Espanola">Española</option>
            <option value="Francesa">Francesa</option>
            <option value="Chilena">Chilena</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pais">País de origen</label>
          <input type="text" id="pais" name="pais" class="form-control"
                 placeholder="Ej. México" maxlength="50">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="dificultad">Dificultad</label>
          <select id="dificultad" name="dificultad" class="form-control">
            <option value="Facil">Fácil</option>
            <option value="Media" selected>Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tiempoPrepMinutos">Tiempo de preparación (min)</label>
          <input type="number" id="tiempoPrepMinutos" name="tiempoPrepMinutos"
                 class="form-control" min="1" max="600" placeholder="Ej. 30">
        </div>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción breve</label>
        <textarea id="descripcion" name="descripcion" class="form-control"
                  rows="2" placeholder="Una breve descripción de tu receta..."></textarea>
      </div>

      <div class="form-group">
        <label for="ingredientes">Ingredientes <small>(separados por comas)</small></label>
        <textarea id="ingredientes" name="ingredientes" class="form-control"
                  rows="3" placeholder="Ej. Pollo, curry en polvo, leche de coco, ajo"></textarea>
      </div>

      <div class="form-group">
        <label for="instrucciones">Instrucciones de preparación</label>
        <textarea id="instrucciones" name="instrucciones" class="form-control"
                  rows="5" placeholder="Describe paso a paso cómo preparar la receta..."></textarea>
      </div>

      <div class="form-group">
        <label for="imagenUrl">URL de imagen principal <small>(opcional)</small></label>
        <input type="url" id="imagenUrl" name="imagenUrl" class="form-control"
               placeholder="https://ejemplo.com/imagen.jpg">
      </div>

      <!-- Subida de fotos y videos adicionales (R-F9) -->
      <fieldset class="media-upload">
        <legend>Fotos y videos adicionales <small>(opcional)</small></legend>
        <p class="media-help">
          Puedes subir múltiples archivos. Formatos permitidos:
          <strong>JPG, PNG, GIF, WebP, MP4, WebM, OGG</strong>. Tamaño máximo: 50&nbsp;MB por archivo.
        </p>

        <div class="form-group">
          <label for="fotos">📷 Fotos</label>
          <input type="file" id="fotos" name="fotos" class="form-control"
                 accept="image/jpeg,image/png,image/gif,image/webp" multiple>
        </div>

        <div class="form-group">
          <label for="videos">🎬 Videos</label>
          <input type="file" id="videos" name="videos" class="form-control"
                 accept="video/mp4,video/webm,video/ogg" multiple>
        </div>
      </fieldset>

      <div style="display:flex; gap:1rem; margin-top:1rem;">
        <button type="submit" class="btn btn-primary btn-block">Publicar Receta</button>
        <a th:href="@{/home}" class="btn btn-outline btn-block">Cancelar</a>
      </div>
    </form>

    <style>
      .media-upload {
        border: 1px dashed var(--border, #d6d6d6);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1rem 0;
        background: #fafafa;
      }
      .media-upload legend {
        padding: 0 .5rem;
        font-weight: 600;
        font-size: .9rem;
        color: var(--text-muted, #555);
      }
      .media-help {
        font-size: .8rem;
        color: var(--text-muted, #666);
        margin-bottom: .75rem;
        line-height: 1.4;
      }
      .media-upload input[type="file"] {
        padding: .35rem 0;
        font-size: .9rem;
      }
    </style>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
