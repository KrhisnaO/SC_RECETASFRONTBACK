<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro - Recetas Premium')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <div class="auth-container">
    <h2 class="section-heading">Crear cuenta</h2>

    <div th:if="${param.registrado}"
         style="background:#d4edda; border:1px solid #c3e6cb; border-radius:8px;
                padding:.9rem 1.25rem; margin-bottom:1.5rem; color:#155724; font-weight:500;">
      Cuenta creada correctamente. Ahora puedes iniciar sesion.
    </div>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post">

      <div class="form-group">
        <label for="username">Nombre de usuario *</label>
        <input type="text" id="username" name="username" class="form-control"
               th:value="${usuarioIngresado}" placeholder="Ej. chef_maria" required maxlength="50">
      </div>

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" class="form-control"
               th:value="${nombreIngresado}" placeholder="Tu nombre completo" maxlength="100">
      </div>

      <div class="form-group">
        <label for="email">Correo electronico *</label>
        <input type="email" id="email" name="email" class="form-control"
               th:value="${emailIngresado}" placeholder="tu@correo.com" required maxlength="100">
      </div>

      <div class="form-group">
        <label for="password">Contrasena *</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Minimo 6 caracteres" required minlength="6">
        <small style="color:var(--text-muted); font-size:.8rem; margin-top:.3rem; display:block;">
          La contrasena se almacena de forma segura (encriptada).
        </small>
      </div>

      <div class="form-group">
        <label for="passwordConfirm">Confirmar contrasena *</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-control"
               placeholder="Repite la contrasena" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
    </form>

    <div class="test-credentials" style="margin-top:1.5rem; text-align:center;">
      <p style="color:var(--text-muted); font-size:.9rem;">
        Ya tienes cuenta? <a th:href="@{/login}" style="color:var(--primary); font-weight:600;">Inicia sesion</a>
      </p>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
