<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - Recetas Premium')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <div class="auth-container">
    <h2 class="section-heading">Iniciar Sesión</h2>

    <div th:if="${error}" class="error-msg">Usuario o contraseña incorrectos.</div>

    <div th:if="${param.logout}" class="success-msg">Sesión cerrada exitosamente.</div>

    <div th:if="${param.registrado}" class="success-msg">
      La cuenta fue creada correctamente. Ya puede iniciar sesión.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
    </div>

    <div class="test-credentials">
      <p>Credenciales de prueba: <b>admin</b> / <b>PasswordAdmin1</b></p>
      <p>Credenciales de prueba: <b>maria</b> / <b>PasswordUser2</b></p>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
