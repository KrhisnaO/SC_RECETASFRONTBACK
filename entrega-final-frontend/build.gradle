plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.recetas'
version = '0.0.1-SNAPSHOT'
description = 'Recetas App - Frontend (Spring Boot + Thymeleaf)'

java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencies {
	// Frontend: Spring Web + Thymeleaf (renderiza vistas HTML)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	// NO tiene Spring Data JPA ni MySQL: sin base de datos propia
	// Pruebas
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco { toolVersion = "0.8.12" }

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: ['com/recetas/frontend/FrontendApplication.class'])
		}))
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule { limit { minimum = 0.90 } }
	}
}
